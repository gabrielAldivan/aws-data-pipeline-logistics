name: CI — AWS Data Pipeline Logistics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python unit tests ───────────────────────────────────────────────────────
  test:
    name: Unit Tests (PySpark + moto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-aws-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample data (local)
        run: python scripts/generate_sample_data.py --rows 5000

      - name: Run Glue job locally (Bronze)
        env:
          SPARK_LOCAL: "true"
          RAW_BUCKET:    local
          BRONZE_BUCKET: local
          GLUE_DATABASE: test_db
        run: python glue_jobs/bronze_ingest.py

      - name: Run Glue job locally (Silver)
        env:
          SPARK_LOCAL: "true"
          BRONZE_BUCKET: local
          SILVER_BUCKET: local
          GLUE_DATABASE: test_db
        run: python glue_jobs/silver_transform.py

      - name: Run Glue job locally (Gold)
        env:
          SPARK_LOCAL:   "true"
          SILVER_BUCKET: local
          GOLD_BUCKET:   local
          GLUE_DATABASE: test_db
        run: python glue_jobs/gold_aggregate.py

      - name: Run unit tests
        run: pytest tests/ -v --cov=glue_jobs --cov=lambda_ --cov-report=term-missing

  # ── Linting ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install flake8 black
      - name: Black
        run: black --check glue_jobs/ emr_jobs/ lambda_/ scripts/ tests/
      - name: Flake8
        run: flake8 glue_jobs/ emr_jobs/ lambda_/ scripts/ --max-line-length=100 --ignore=E203,W503,F401,F403
